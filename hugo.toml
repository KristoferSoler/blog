baseURL      = "https://0x4d72.com/"
languageCode = "es"
title        = "0x4d72"
theme        = "void"

defaultContentLanguage = "es"
enableRobotsTXT        = true
enableGitInfo          = false
[pagination]
  pagerSize = 10

[params]
  description = "Code, Ideas, Thoughts, and Security"
  github      = "KristoferSoler"
  twitter     = "SolerKristofer"
  linkedin  = "kristofersoler"

[markup]
  [markup.highlight]
    style              = "catppuccin-mocha"
    lineNos            = false
    lineNumbersInTable = false
    noClasses          = false
    guessSyntax        = true
    tabWidth           = 2

  [markup.goldmark.renderer]
    unsafe = true

  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 4

[taxonomies]
  tag      = "tags"
  category = "categories"

[menus]
  [[menus.main]]
    name   = "posts"
    url    = "/posts/"
    weight = 1
  [[menus.main]]
    name   = "tags"
    url    = "/tags/"
    weight = 2
  [[menus.main]]
    name   = "about"
    url    = "/about/"
    weight = 3
  [[menus.main]]
    name   = "search"
    url    = "/search/"
    weight = 4

[outputs]
  home    = ["HTML", "RSS"]
  page    = ["HTML"]
  section = ["HTML", "RSS"]
